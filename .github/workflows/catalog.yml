# Rigenera public/data/catalog.json e lo committa: Cloudflare Pages ripubblica da solo.
name: Aggiorna catalogo corsi
on:
  schedule:
    - cron: "0 4 * * 1"   # ogni lunedì alle 04:00 UTC
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node scripts/build-catalog.mjs
      - run: node scripts/build-pages.mjs
      - name: Commit se cambiato
        run: |
          if git diff --quiet -- public/data public/corsi public/sitemap.xml && [ -z "$(git ls-files --others --exclude-standard public/corsi)" ]; then echo "Nessuna modifica"; exit 0; fi
          git config user.name "catalog-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data public/corsi public/sitemap.xml
          git commit -m "chore: aggiorna catalogo corsi"
          git push
